name: ci-pipeline

on: 
  workflow_dispatch:

jobs:
  Code Checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

  build-and-push:
    runs-on: ubuntu-latest  

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
